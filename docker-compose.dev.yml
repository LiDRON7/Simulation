services:
  drone-dev:
    image: lidron-sim:dev      # one image for all three containers
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: drone_sim_dev
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - GZ_SIM_RESOURCE_PATH=/drone_sim/models:/drone_sim/worlds:/px4/Tools/simulation/gz/models
      - GPU_VENDOR=${GPU_VENDOR:-none}
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=4.5
      - MESA_GLSL_VERSION_OVERRIDE=450
      - GALLIUM_DRIVER=llvmpipe
      - MESA_LOADER_DRIVER_OVERRIDE=swrast
      - GZ_IP=127.0.0.1
      # .env: HEADLESS=1 runs without the Gazebo window (no X11 needed).
      # SENSORS=off drops camera and LiDAR rendering, for machines with no GPU.
      - HEADLESS=${HEADLESS:-}
      - SENSORS=${SENSORS:-on}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./models:/drone_sim/models
      - ./worlds:/drone_sim/worlds
      - ./config:/drone_sim/config
    command: >
      bash -c "
        cp /drone_sim/worlds/outdoor_field.sdf /tmp/world.sdf &&
        if [ $$SENSORS = off ]; then sed -i '/gz-sim-sensors-system/,/<\\/plugin>/d' /tmp/world.sdf; fi &&
        gz sim /tmp/world.sdf --headless-rendering -r $${HEADLESS:+-s}
      "

  px4:
    image: lidron-sim:dev      # one image for all three containers
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: drone_px4
    network_mode: host
    environment:
      - GZ_IP=127.0.0.1
      - PX4_GZ_WORLD=outdoor_field
      - PX4_SIM_HOST_ADDR=127.0.0.1
      - PX4_GZ_STANDALONE=1
      # DRONE=widow or huntsman (.env). PX4 finds the airframe file by this name; the model comes from ./models.
      - PX4_SIM_MODEL=gz_${DRONE:-huntsman}
      - PX4_GZ_MODEL_POSE=0,0,0.25,0,0,0
      - PX4_SIMULATOR=gz
      - GZ_SIM_RESOURCE_PATH=/drone_sim/models:/px4/Tools/simulation/gz/models
    volumes:
      - ./models:/drone_sim/models
      - ./config/airframes/22001_gz_widow:/px4/build/px4_sitl_default/etc/init.d-posix/airframes/22001_gz_widow:ro
      - ./config/airframes/22002_gz_huntsman:/px4/build/px4_sitl_default/etc/init.d-posix/airframes/22002_gz_huntsman:ro
    depends_on:
      - drone-dev
    command: >
      bash -c "
        sleep 20 &&
        source /opt/ros/jazzy/setup.bash &&
        cd /px4/build/px4_sitl_default &&
        ./bin/px4 -d -s etc/init.d-posix/rcS
      "

  ros:
    image: lidron-sim:dev      # one image for all three containers
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: drone_ros
    network_mode: host
    ipc: host
    environment:
      - GZ_IP=127.0.0.1
      - DRONE=${DRONE:-huntsman}
      - GZ_SIM_RESOURCE_PATH=/drone_sim/models:/drone_sim/worlds:/px4/Tools/simulation/gz/models
    volumes:
      - ./models:/drone_sim/models
      - ./worlds:/drone_sim/worlds
      - ./config:/drone_sim/config
    command: >
      bash -c "
        sleep 30 &&
        source /opt/ros/jazzy/setup.bash &&
        python3 /drone_sim/config/simulation_launch.py
      "
